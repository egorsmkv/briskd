name: CI

# Push only. A docs-only push does not start this workflow. Each job then
# runs only when a file it builds or tests is in the push.
on:
  push:
    paths:
      - "src/**"
      - "include/**"
      - "test/**"
      - "webui/**"
      - "priv/webui/**"
      - "search/**"
      - "docker/rtpflux/**"
      - "Dockerfile"
      - "rebar.config"
      - "rebar.lock"
      - "justfile"
      - ".elp_lint.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: select jobs
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
      e2ee: ${{ steps.filter.outputs.e2ee }}
      search: ${{ steps.filter.outputs.search }}
      calls: ${{ steps.filter.outputs.calls }}
      calls_browser: ${{ steps.filter.outputs.calls_browser }}
      webui: ${{ steps.filter.outputs.webui }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match changed paths to jobs
        id: filter
        run: |
          set -eu
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          all=false
          files=""
          zero=0000000000000000000000000000000000000000
          if [ -z "$before" ] || [ "$before" = "$zero" ]; then
            all=true
          elif ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            all=true
          else
            files="$(git diff --name-only "$before" "$sha")"
          fi

          hit() {
            if [ "$all" = true ]; then
              return 0
            fi
            printf '%s\n' "$files" | grep -Eq "$1"
          }
          flag() {
            if hit "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # The development image compiles this tree. Jobs that boot briskd share it.
          server='^(src/|include/|rebar\.config$|rebar\.lock$|Dockerfile$|\.github/workflows/ci\.yml$)'
          flag test "${server}|^(justfile$|\.elp_lint\.toml$|webui/|priv/webui/|test/.*\.erl$|test/.*\.hrl$)"
          flag e2ee "${server}|^test/e2ee/"
          flag search '^(search/|\.github/workflows/ci\.yml$)'
          flag webui "${server}|^(webui/|priv/webui/|test/webui/)"

          calls=false
          browser=false
          # WebUI sources do not affect the Python voice-call harness.
          if [ "$all" = true ] || hit "${server}|^docker/rtpflux/"; then
            calls=true
            browser=true
          fi
          if [ "$all" = false ] && hit '^(webui/|priv/webui/)'; then
            browser=true
          fi
          if [ "$all" = false ]; then
            if printf '%s\n' "$files" | grep -E '^test/calls/' | grep -qv '^test/calls/browser/'; then
              calls=true
            fi
            if printf '%s\n' "$files" | grep -Eq '^(test/calls/browser/|test/webui/Dockerfile$|test/webui/server\.sh$|test/e2ee/server\.sh$)'; then
              browser=true
            fi
            if printf '%s\n' "$files" | grep -Eq '^test/e2ee/server\.sh$'; then
              calls=true
            fi
          fi
          echo "calls=${calls}" >> "$GITHUB_OUTPUT"
          echo "calls_browser=${browser}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$files" | head -n 50

  test:
    name: format, lint, eqwalize, and eunit
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the OTP 29 development image
        run: docker build -t briskd-ci .

      - name: Check formatting, lint, type-check, and run tests
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/workspace"
          -w /workspace
          briskd-ci
          sh -c "just format-check && just lint && just eqwalize && just test-webui && just test"

  e2ee:
    name: E2EE end-to-end (two linked servers, Python clients)
    needs: changes
    if: needs.changes.outputs.e2ee == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run test/e2ee/run
        run: test/e2ee/run

  search:
    name: Search service (Rust)
    needs: changes
    if: needs.changes.outputs.search == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      # The same toolchain as search/Dockerfile's build stage.
      - name: Format, lint, and test in the Rust image
        run: >-
          docker run --rm -v "$PWD/search:/src" -w /src rust:1.99.0-slim-bookworm
          sh -c "rustup component add rustfmt clippy
          && cargo fmt --check
          && cargo clippy --locked --all-targets -- -D warnings
          && cargo test --locked"
      - name: Build the image
        run: docker build -t briskd-search-ci search

  calls:
    name: Voice calls end-to-end (briskd, rtpflux, WebRTC clients)
    needs: changes
    if: needs.changes.outputs.calls == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run test/calls/run
        run: test/calls/run

  calls-browser:
    name: Video calls in a browser (WebIRC, rtpflux, headless Chromium)
    needs: changes
    if: needs.changes.outputs.calls_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run test/calls/browser/run
        run: test/calls/browser/run

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calls-browser-screenshots
          path: test/calls/browser/shots/
          if-no-files-found: ignore

  webui:
    name: WebIRC in a browser (light and dark, contrast and page errors)
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run test/webui/run
        run: test/webui/run

      - name: Keep the screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webirc-screenshots
          path: test/webui/shots/
          if-no-files-found: ignore
