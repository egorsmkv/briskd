name: Docs

# Build the ex_doc HTML documentation with rebar3 in the OTP 29 development
# image. Every push and pull request checks that the docs build; pushes to
# main publish them to GitHub Pages.
#
# One-time repository setting: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the OTP 29 development image
        run: docker build -t briskd-ci .

      - name: Build HTML documentation with rebar3 ex_doc
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/workspace"
          -w /workspace
          briskd-ci
          sh -c "just docs"

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
