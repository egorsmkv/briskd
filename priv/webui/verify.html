<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Account - ircd</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --hover: #eef2f6;
    --border: #d8dee6;
    --text: #1c2430;
    --muted: #5d6b7d;
    --accent: #1d4ed8;
    --accent-hover: #1e40af;
    --danger: #b91c1c;
    --ok: #15803d;
    --notice-ok-bg: #f0fdf4;
    --notice-ok-border: #86efac;
    --notice-err-bg: #fef2f2;
    --notice-err-border: #fca5a5;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f141b;
    --surface: #171e28;
    --hover: #243040;
    --border: #2c384a;
    --text: #e6edf5;
    --muted: #93a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
    --ok: #4ade80;
    --notice-ok-bg: #112a1d;
    --notice-ok-border: #22543d;
    --notice-err-bg: #2e1518;
    --notice-err-border: #7f1d1d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px 24px;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  h1 { margin: 0; font-size: 19px; }
  .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .field { margin-bottom: 14px; }
  input {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  button {
    font: inherit;
    padding: 8px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: var(--hover); }
  button.primary {
    width: 100%;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    padding: 9px 14px;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.65; cursor: not-allowed; }
  button.small { padding: 4px 9px; font-size: 12px; }
  #notice {
    display: none;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    font-size: 13px;
  }
  #notice.ok {
    display: block;
    border-color: var(--notice-ok-border);
    background: var(--notice-ok-bg);
    color: var(--ok);
  }
  #notice.err {
    display: block;
    border-color: var(--notice-err-border);
    background: var(--notice-err-bg);
    color: var(--danger);
  }
  .altcha-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
  }
  .altcha-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    cursor: pointer;
    margin: 0;
  }
  .altcha-left input { width: auto; margin: 0; }
  .altcha-brand {
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
  }
  .altcha-brand:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <h1>Verify IRC Account</h1>
    <button type="button" class="small" id="btn-theme" aria-label="Toggle dark mode">Dark</button>
  </div>
  <p class="sub">Paste your email address and the verification code from your email.</p>

  <div id="notice" role="status" aria-live="polite"></div>

  <form id="verify-form">
    <input type="hidden" id="account" value="__ACCOUNT_PREFILL__">
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" maxlength="254" value="__EMAIL_PREFILL__" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="code">Verification code</label>
      <input type="text" id="code" name="code" autocomplete="one-time-code" required maxlength="64" value="__CODE_PREFILL__" placeholder="Paste verification code">
    </div>
    <div class="field">
      <div class="altcha-box">
        <label class="altcha-left" for="altcha-check">
          <input type="checkbox" id="altcha-check">
          <span id="altcha-label">I'm not a robot</span>
        </label>
        <a class="altcha-brand" href="https://altcha.org/" target="_blank" rel="noopener noreferrer">ALTCHA</a>
      </div>
    </div>
    <button type="submit" class="primary" id="btn-submit">Verify Account</button>
  </form>
  <p class="sub" style="margin-top:14px;margin-bottom:0;text-align:center;">Need an account? <a href="/signup" style="color:var(--accent);">Sign up</a></p>
</main>

<script nonce="__CSP_NONCE__">
(function() {
  const $ = (id) => document.getElementById(id);

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    $("btn-theme").textContent = theme === "dark" ? "Light" : "Dark";
  }

  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem("ircd-webui-theme"); } catch (_) {}
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved === "dark" || saved === "light" ? saved : (prefersDark ? "dark" : "light"));
  })();

  $("btn-theme").onclick = () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("ircd-webui-theme", next); } catch (_) {}
  };

  function showNotice(ok, text) {
    const n = $("notice");
    n.className = ok ? "ok" : "err";
    n.textContent = text;
  }

  function sha256Fallback(str) {
    const bytes = new TextEncoder().encode(str);
    const bitLen = bytes.length * 8;
    const padded = new Uint8Array(((bytes.length + 9 + 63) >> 6) << 6);
    padded.set(bytes);
    padded[bytes.length] = 0x80;
    const dv = new DataView(padded.buffer);
    dv.setUint32(padded.length - 8, Math.floor(bitLen / 0x100000000), false);
    dv.setUint32(padded.length - 4, bitLen >>> 0, false);
    const K = [
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
    const w = new Uint32Array(64);
    for (let i = 0; i < padded.length; i += 64) {
      for (let j = 0; j < 16; j++) w[j] = dv.getUint32(i + j * 4, false);
      for (let j = 16; j < 64; j++) {
        const s0 = ((w[j-15]>>>7)|(w[j-15]<<25)) ^ ((w[j-15]>>>18)|(w[j-15]<<14)) ^ (w[j-15]>>>3);
        const s1 = ((w[j-2]>>>17)|(w[j-2]<<15)) ^ ((w[j-2]>>>19)|(w[j-2]<<13)) ^ (w[j-2]>>>10);
        w[j] = (w[j-16] + s0 + w[j-7] + s1) >>> 0;
      }
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for (let j = 0; j < 64; j++) {
        const S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[j] + w[j]) >>> 0;
        const S0 = ((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10));
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
      }
      h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0;
      h4=(h4+e)>>>0; h5=(h5+f)>>>0; h6=(h6+g)>>>0; h7=(h7+h)>>>0;
    }
    return [h0,h1,h2,h3,h4,h5,h6,h7].map((x) => x.toString(16).padStart(8, "0")).join("");
  }

  async function sha256Hex(str) {
    if (window.crypto && window.crypto.subtle) {
      const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    return sha256Fallback(str);
  }

  let altchaPayload = null;
  function resetAltcha() {
    altchaPayload = null;
    $("altcha-check").checked = false;
    $("altcha-check").disabled = false;
    $("altcha-label").textContent = "I'm not a robot";
  }

  $("altcha-check").onchange = async () => {
    if (!$("altcha-check").checked) { resetAltcha(); return; }
    $("altcha-check").disabled = true;
    $("altcha-label").textContent = "Verifying...";
    try {
      const res = await fetch("/api/altcha", { cache: "no-store" });
      if (!res.ok) throw new Error("Challenge unavailable");
      const ch = await res.json();
      const max = ch.maxnumber || 50000;
      let found = -1;
      for (let n = 0; n <= max; n++) {
        if ((await sha256Hex(ch.salt + n)) === ch.challenge) { found = n; break; }
      }
      if (found < 0) throw new Error("Verification failed");
      altchaPayload = btoa(JSON.stringify({
        algorithm: ch.algorithm,
        challenge: ch.challenge,
        number: found,
        salt: ch.salt,
        signature: ch.signature
      }));
      $("altcha-label").textContent = "Verified";
    } catch (e) {
      resetAltcha();
      showNotice(false, "ALTCHA error: " + e.message);
    }
  };

  if ($("account").value && !$("email").value) {
    $("email").placeholder = "Using account: " + $("account").value;
  }

  $("verify-form").onsubmit = async (ev) => {
    ev.preventDefault();
    const email = $("email").value.trim();
    const account = $("account").value.trim();
    const code = $("code").value.trim();
    if (!email && !account) {
      showNotice(false, "Enter your email address.");
      return;
    }
    if (!altchaPayload) {
      showNotice(false, "Please complete the ALTCHA verification.");
      return;
    }
    const btn = $("btn-submit");
    btn.disabled = true;
    try {
      const payload = { code: code, altcha: altchaPayload };
      if (email) payload.email = email;
      else payload.account = account;
      const res = await fetch("/api/verify", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Requested-With": "ircd-webui"
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (res.ok) {
        showNotice(
          true,
          "Account '" + data.account + "' has been verified. You can now log in via SASL."
        );
        $("verify-form").reset();
        $("account").value = "";
      } else {
        showNotice(false, data.message || data.error || "Verification failed.");
      }
    } catch (e) {
      showNotice(false, "Request failed: " + e.message);
    } finally {
      resetAltcha();
      btn.disabled = false;
    }
  };
})();
</script>
</body>
</html>
