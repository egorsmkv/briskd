<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ircd admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
<header>
  <div class="brand">
    <h1 id="srv-name">ircd</h1>
    <span id="srv-status" class="badge">loading</span>
    <span id="srv-meta" class="muted"></span>
  </div>
  <div class="header-controls">
    <label class="muted"><input type="checkbox" id="auto-refresh" checked> Auto-refresh (5s)</label>
    <button type="button" id="btn-theme" aria-label="Toggle dark mode">Dark</button>
    <button type="button" id="btn-refresh">Refresh</button>
  </div>
</header>

<main>
  <div id="notice"></div>

  <section class="grid" id="stats-grid">
    <div class="card">
      <div class="label">Sessions</div>
      <div class="value" id="st-sessions">-</div>
      <div class="sub" id="st-sessions-sub"></div>
    </div>
    <div class="card">
      <div class="label">Channels</div>
      <div class="value" id="st-channels">-</div>
      <div class="sub" id="st-channels-sub"></div>
    </div>
    <div class="card">
      <div class="label">Network</div>
      <div class="value" id="st-network">-</div>
      <div class="sub" id="st-network-sub"></div>
    </div>
    <div class="card">
      <div class="label">Accounts</div>
      <div class="value" id="st-accounts">-</div>
      <div class="sub" id="st-retention"></div>
    </div>
    <div class="card">
      <div class="label">DroneBL</div>
      <div class="value" id="st-dronebl">-</div>
      <div class="sub" id="st-dronebl-sub"></div>
    </div>
    <div class="card">
      <div class="label">Database</div>
      <div class="value" id="st-db">-</div>
      <div class="sub" id="st-db-sub"></div>
    </div>
    <div class="card">
      <div class="label">Erlang VM</div>
      <div class="value" id="st-memory">-</div>
      <div class="sub" id="st-procs"></div>
    </div>
  </section>

  <section class="toolbar">
    <button type="button" class="primary" id="btn-rehash">Rehash Config</button>
    <button type="button" id="btn-check-config">Check Config</button>
    <button type="button" id="btn-reload-certs">Reload TLS Certs</button>
    <button type="button" id="btn-notice-all">Broadcast Notice</button>
    <select id="sel-log-level" aria-label="Log level">
      <option value="debug">debug</option>
      <option value="info">info</option>
      <option value="notice">notice</option>
      <option value="warning">warning</option>
      <option value="error">error</option>
      <option value="critical">critical</option>
      <option value="alert">alert</option>
      <option value="emergency">emergency</option>
    </select>
    <button type="button" id="btn-log-level">Set Log Level</button>
    <input type="text" id="inp-backup" placeholder="/tmp/mnesia.bak" size="18">
    <button type="button" id="btn-backup">Backup Mnesia</button>
    <span class="spacer"></span>
    <button type="button" class="danger" id="btn-drain">Drain</button>
    <button type="button" class="danger" id="btn-stop">Stop Server</button>
  </section>

  <nav class="tabs" id="tabs">
    <button type="button" class="tab active" data-tab="clients">Clients (<span id="cnt-clients">0</span>)</button>
    <button type="button" class="tab" data-tab="channels">Channels (<span id="cnt-channels">0</span>)</button>
    <button type="button" class="tab" data-tab="links">Links (<span id="cnt-links">0</span>)</button>
    <button type="button" class="tab" data-tab="accounts">Accounts (<span id="cnt-accounts">0</span>)</button>
    <button type="button" class="tab" data-tab="dronebl">DroneBL (<span id="cnt-dronebl">0</span>)</button>
  </nav>

  <section class="panel active" id="panel-clients">
    <div id="clients-wrap"></div>
  </section>

  <section class="panel" id="panel-channels">
    <div id="channels-wrap"></div>
  </section>

  <section class="panel" id="panel-links">
    <form class="inline-form" id="form-connect">
      <input type="text" id="inp-peer" placeholder="Configured peer name" required>
      <button type="submit" class="primary">Connect Peer</button>
    </form>
    <div id="links-wrap"></div>
  </section>

  <section class="panel" id="panel-accounts">
    <form class="inline-form" id="form-account">
      <input type="text" id="inp-acct-name" placeholder="Account name" required>
      <input type="password" id="inp-acct-pass" placeholder="Password" required>
      <input type="email" id="inp-acct-email" placeholder="Email (optional)">
      <button type="submit" class="primary">Create Account</button>
    </form>
    <div id="accounts-wrap"></div>
  </section>

  <section class="panel" id="panel-dronebl">
    <form class="inline-form" id="form-ban-ip">
      <input type="text" id="inp-ban-ip" placeholder="IP address to ban" required>
      <input type="text" id="inp-ban-reason" placeholder="Reason (optional)">
      <button type="submit" class="danger">Ban IP</button>
    </form>
    <div id="dronebl-wrap"></div>
  </section>
</main>

<script src="/assets/admin.js" defer></script>
</body>
</html>
