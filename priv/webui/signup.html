<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up - ircd</title>
<meta name="description" content="Create an IRC SASL account for secure authentication and end-to-end encrypted messaging.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2563eb">
<meta property="og:type" content="website">
<meta property="og:title" content="Create IRC Account">
<meta property="og:description" content="Create an IRC SASL account for secure authentication and end-to-end encrypted messaging.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/signup.css">
</head>
<body>
<main class="card">
  <div class="top">
    <h1>Create IRC Account</h1>
    <button type="button" class="small" id="btn-theme" aria-label="Toggle dark mode">Dark</button>
  </div>
  <p class="sub">Register an account for SASL authentication on this IRC server.</p>

  <div id="notice" role="status" aria-live="polite"></div>

  <form id="signup-form">
    <div class="field">
      <label for="account">Account name</label>
      <input type="text" id="account" name="account" autocomplete="username" required maxlength="64">
    </div>
    <div class="field">
      <label for="email">Email <span class="muted">(if required by server)</span></label>
      <input type="email" id="email" name="email" autocomplete="email" maxlength="254">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required maxlength="256">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" required maxlength="256">
    </div>
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="accept-terms" name="accept_terms" required>
        <span>I accept the <a href="__TERMS_URL__" target="_blank" rel="noopener noreferrer">Terms of Use</a> and <a href="__PRIVACY_URL__" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</span>
      </label>
    </div>
    <div class="field">
      <div class="altcha-box">
        <label class="altcha-left" for="altcha-check">
          <input type="checkbox" id="altcha-check">
          <span id="altcha-label">I'm not a robot</span>
        </label>
        <a class="altcha-brand" href="https://altcha.org/" target="_blank" rel="noopener noreferrer">ALTCHA</a>
      </div>
    </div>
    <button type="submit" class="primary btn-full" id="btn-submit">Create Account</button>
  </form>
  <p class="foot-links">Already have a code? <a href="/verify">Verify your account</a> &middot; <a href="/">Open WebIRC</a></p>
</main>

<script src="/assets/signup.js" defer></script>
</body>
</html>
