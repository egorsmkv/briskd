<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NETWORK_NAME__ - WebIRC</title>
<link rel="stylesheet" href="/assets/webirc.css">
</head>
<body data-ws-port="__WS_PORT__" data-wss-port="__WSS_PORT__">

<section id="connect-view">
  <div class="connect-card">
    <div class="connect-top">
      <h1>__NETWORK_NAME__ WebIRC</h1>
      <button type="button" class="small" id="btn-theme-1">Dark</button>
    </div>
    <p class="sub">Team IRC workspace over IRCv3 WebSocket.</p>
    <div id="connect-err"></div>
    <form id="connect-form">
      <div class="field">
        <label for="inp-nick">Nickname</label>
        <input type="text" id="inp-nick" required maxlength="30" placeholder="alex">
      </div>
      <div class="field">
        <label for="inp-channels">Channels</label>
        <input type="text" id="inp-channels" value="__DEFAULT_CHANNELS__" placeholder="#lobby">
      </div>
      <div class="row-2">
        <div class="field">
          <label for="inp-acct">SASL Account (optional)</label>
          <input type="text" id="inp-acct" autocomplete="username" maxlength="64">
        </div>
        <div class="field">
          <label for="inp-pass">SASL Password</label>
          <input type="password" id="inp-pass" autocomplete="current-password" maxlength="256">
        </div>
      </div>
      <div class="field">
        <label for="inp-ws">WebSocket URL</label>
        <input type="text" id="inp-ws" required>
      </div>
      <button type="submit" class="primary btn-full">Connect</button>
    </form>
    <p class="foot-links">
      <a href="/signup">Create account</a> &middot; <a href="/verify">Verify account</a>
    </p>
  </div>
</section>

<section id="chat-view">
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="sidebar-left" id="sidebar-left">
    <div class="workspace-brand">
      <span>__NETWORK_NAME__</span>
      <button type="button" class="small mobile-only" id="btn-close-left" aria-label="Close channels">×</button>
    </div>
    <div class="buffer-scroll">
      <div class="section-label">Channels</div>
      <div id="channel-list"></div>
      <div class="section-label">Direct Messages</div>
      <div id="dm-list"></div>
    </div>
    <form class="join-box" id="join-form">
      <input type="text" id="inp-join" placeholder="#channel">
      <button type="submit" class="small">Join</button>
    </form>
  </aside>

  <header class="chat-head">
    <div class="head-left">
      <button type="button" class="small mobile-only" id="btn-menu" aria-label="Toggle channels">☰</button>
      <span class="status-dot" id="status-dot"></span>
      <span class="head-title" id="active-title">Server Status</span>
      <span class="head-topic" id="active-topic"></span>
      <button type="button" class="small hidden" id="btn-topic">Edit topic</button>
    </div>
    <div class="head-right">
      <span class="my-nick" id="my-nick"></span>
      <button type="button" class="small tablet-only" id="btn-members" aria-label="Toggle members">Users</button>
      <button type="button" class="small primary hidden" id="btn-reconnect">Reconnect</button>
      <button type="button" class="small" id="btn-theme-2">Dark</button>
      <button type="button" class="small danger" id="btn-disconnect">Disconnect</button>
    </div>
  </header>

  <div class="messages" id="messages"></div>

  <form class="input-bar" id="send-form">
    <input type="text" id="inp-msg" autocomplete="off" placeholder="Message or /help (Tab to complete nicks, Alt+Up/Down to switch)">
    <button type="submit" class="primary">Send</button>
  </form>

  <aside class="sidebar-right" id="sidebar-right">
    <div class="members-head">
      <div class="members-head-top">
        <div class="members-title" id="members-title">Members</div>
        <button type="button" class="small tablet-only" id="btn-close-right" aria-label="Close members">×</button>
      </div>
      <input type="text" id="inp-member-filter" placeholder="Filter members...">
    </div>
    <div id="members-list"></div>
  </aside>
</section>

<script src="/assets/webirc.js" defer></script>
</body>
</html>
