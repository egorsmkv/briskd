[package]
name = "ircd-search"
version = "0.1.0"
edition = "2024"
description = "Tantivy message index for ircd's egorsmkv.github.io/search extension"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tantivy = "=0.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
