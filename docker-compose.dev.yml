services:
  inbucket:
    image: inbucket/inbucket:latest
    ports:
      - "2500:2500"
      - "9000:9000"

  ircd-dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["just", "run-config", "config/ircd.dev.json"]
    depends_on:
      - inbucket
    environment:
      IRCD_CONFIG: config/ircd.dev.json
    ports:
      - "6667:6667"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - .:/workspace
      - rebar3-cache:/root/.cache/rebar3
      - ircd-mnesia:/var/lib/ircd/mnesia
    stdin_open: true
    tty: true

volumes:
  rebar3-cache:
  ircd-mnesia:
