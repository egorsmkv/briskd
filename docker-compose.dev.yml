services:
  inbucket:
    image: inbucket/inbucket:latest
    ports:
      - "2500:2500"
      - "9000:9000"

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs-data:/data

  # Media relay for WebIRC voice calls. Browsers on this machine reach it at
  # 127.0.0.1 through the published UDP port range.
  rtpengine:
    build:
      context: docker/rtpengine
    environment:
      RTPENGINE_ADVERTISE: 127.0.0.1
      RTPENGINE_PORT_MIN: "30000"
      RTPENGINE_PORT_MAX: "30100"
    ports:
      - "30000-30100:30000-30100/udp"

  # Two linked servers of one network (RFC 2813 over the compose network):
  # irc.dev (ircd-dev, config/ircd.dev.json) and irc2.dev (ircd-dev2,
  # config/ircd.dev2.json). Each lists the other in `server_links`, so they
  # link whichever starts first. Clients on either see the same channels and
  # users, which exercises bursts, propagation, and cross-server delivery.
  ircd-dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    # Web UI assets are generated (not committed): build them, then start.
    command: ["sh", "-c", "just build-webui && just run-config config/ircd.dev.json"]
    depends_on:
      - inbucket
      - rustfs
      - rtpengine
    env_file:
      - .dev.env
    ports:
      - "6667:6667"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - .:/workspace
      - rebar3-cache:/root/.cache/rebar3
      - deno-cache:/root/.cache/deno
      - ircd-mnesia:/var/lib/ircd/mnesia
    # As docker-compose.prod.yml: the default 1024 descriptors run out at
    # about a thousand clients.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stdin_open: true
    tty: true

  # The second node: IRC on 6668, WebSocket on 8082, web UI on 8083 (the same
  # numbers inside the container, so its web pages point browsers at its own
  # WebSocket port). It has its own Mnesia volume and its own build directory
  # (REBAR_BASE_DIR), so the two `rebar3 shell`s never compile into the same
  # _build. It waits for the web assets ircd-dev builds instead of building
  # them a second time, and runs no AI bots (the same bot nicknames on both
  # servers would collide across the link).
  ircd-dev2:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command:
      - sh
      - -c
      - until [ -f priv/webui/assets/app.js ]; do sleep 2; done; just run-config config/ircd.dev2.json
    depends_on:
      - ircd-dev
    env_file:
      - .dev.env
    environment:
      REBAR_BASE_DIR: /build
    ports:
      - "6668:6668"
      - "8082:8082"
      - "8083:8083"
    volumes:
      - .:/workspace
      - rebar3-cache:/root/.cache/rebar3
      - ircd2-build:/build
      - ircd2-mnesia:/var/lib/ircd/mnesia
    # As docker-compose.prod.yml: the default 1024 descriptors run out at
    # about a thousand clients.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stdin_open: true
    tty: true

volumes:
  rebar3-cache:
  deno-cache:
  ircd-mnesia:
  ircd2-mnesia:
  ircd2-build:
  rustfs-data:
