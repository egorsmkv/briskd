services:
  inbucket:
    image: inbucket/inbucket:latest
    ports:
      - "2500:2500"
      - "9000:9000"

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs-data:/data

  # Media relay for WebIRC voice calls. Browsers on this machine reach it at
  # 127.0.0.1 through the published UDP port range.
  rtpengine:
    build:
      context: docker/rtpengine
    environment:
      RTPENGINE_ADVERTISE: 127.0.0.1
      RTPENGINE_PORT_MIN: "30000"
      RTPENGINE_PORT_MAX: "30100"
    ports:
      - "30000-30100:30000-30100/udp"

  ircd-dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    # Web UI assets are generated (not committed): build them, then start.
    command: ["sh", "-c", "just build-webui && just run-config config/ircd.dev.json"]
    depends_on:
      - inbucket
      - rustfs
      - rtpengine
    env_file:
      - .dev.env
    ports:
      - "6667:6667"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - .:/workspace
      - rebar3-cache:/root/.cache/rebar3
      - deno-cache:/root/.cache/deno
      - ircd-mnesia:/var/lib/ircd/mnesia
    stdin_open: true
    tty: true

volumes:
  rebar3-cache:
  deno-cache:
  ircd-mnesia:
  rustfs-data:
