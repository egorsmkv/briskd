# End-to-end test for voice calls: ircd, a real rtpengine, and two Python
# WebRTC clients (aiortc) that call each other over IRC and check that audio
# flows both ways through rtpengine (test/calls/run).
#
#   docker compose -f test/calls/docker-compose.yml up --build \
#       --abort-on-container-exit --exit-code-from tests

services:
  ircd:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ircd-calls-server
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    command: ["sh", "/workspace/test/e2ee/server.sh", "/workspace/test/calls/ircd.json"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6667"]
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      - rtpengine
  rtpengine:
    build:
      context: ../../docker/rtpengine
    image: ircd-rtpengine
    environment:
      RTPENGINE_LOG_LEVEL: "6"
  tests:
    image: python:3.12.12-slim
    working_dir: /tests
    volumes:
      - .:/tests:ro
    environment:
      CALLS_IRC: ircd:6667
      CALLS_NG: rtpengine:2223
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - sh
      - -c
      - pip install --quiet -r requirements.txt && python -m pytest -v -p no:cacheprovider test_calls.py
    depends_on:
      ircd:
        condition: service_healthy
