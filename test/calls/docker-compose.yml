# End-to-end test for voice calls: briskd, a real rtpflux, and two Python
# WebRTC clients (aiortc) that call each other over IRC and check that audio
# flows both ways through rtpflux (test/calls/run).
#
#   docker compose -f test/calls/docker-compose.yml up --build \
#       --abort-on-container-exit --exit-code-from tests

services:
  briskd:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: briskd-calls-server
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    command: ["sh", "/workspace/test/e2ee/server.sh", "/workspace/test/calls/briskd.json"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6667"]
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      - rtpflux
  rtpflux:
    build:
      context: ../../docker/rtpflux
    image: briskd-rtpflux
    environment:
      RTPFLUX_LOG_LEVEL: info
  tests:
    image: python:3.12.12-slim
    working_dir: /tests
    volumes:
      - .:/tests:ro
    environment:
      CALLS_IRC: briskd:6667
      CALLS_NG: rtpflux:2223
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - sh
      - -c
      - pip install --quiet -r requirements.txt && python -m pytest -v -p no:cacheprovider test_calls.py
    depends_on:
      briskd:
        condition: service_healthy
